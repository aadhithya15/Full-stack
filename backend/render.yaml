# Render deployment config - HueFit backend (free tier)
# Connect the GitHub repo on render.com -> New -> Blueprint and this file is auto-detected.
services:
  - type: web
    name: huefit-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" -b 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7          # stable, all wheels available (local 3.14 is fine too)
      - key: FLASK_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173   # UPDATE after frontend deploys: add https://yourapp.vercel.app (comma-separated)
      - key: MAX_UPLOAD_MB
        value: "5"
      # Secrets - set these in the Render dashboard (sync: false = never in the repo)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
